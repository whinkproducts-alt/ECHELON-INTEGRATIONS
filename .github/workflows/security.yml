name: security

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '17 6 * * 1' # weekly, Monday 06:17 UTC

permissions:
  contents: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    name: pnpm audit (production dependencies)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with:
          version: 10.28.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - name: Audit production dependencies (fails on high or critical)
        run: pnpm audit --prod --audit-level=high

  gitleaks:
    name: gitleaks secret scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      # Direct scan of the full history with the gitleaks CLI (MIT licensed), same version the action ran (8.24.3).
      # The action scans "<first PR commit>^..<last>", which git cannot resolve when the PR contains a root commit
      # (the imported WHINK history), so it scanned nothing and failed. A full-history scan is stricter and needs
      # no commit range. The tarball is verified against the checksums published with the same release; the job
      # fails if either download or the check fails. --redact keeps secret values out of the log.
      - name: Install gitleaks 8.24.3 (checksum verified)
        run: |
          set -euo pipefail
          v=8.24.3
          base="https://github.com/gitleaks/gitleaks/releases/download/v${v}"
          mkdir -p "$RUNNER_TEMP/gitleaks"
          cd "$RUNNER_TEMP/gitleaks"
          curl -fsSL -O "${base}/gitleaks_${v}_linux_x64.tar.gz"
          curl -fsSL -O "${base}/gitleaks_${v}_checksums.txt"
          grep " gitleaks_${v}_linux_x64.tar.gz\$" "gitleaks_${v}_checksums.txt" | sha256sum -c -
          tar xzf "gitleaks_${v}_linux_x64.tar.gz" gitleaks
          echo "$PWD" >> "$GITHUB_PATH"
      - name: Scan full history
        run: gitleaks detect --source . --redact --verbose --exit-code 2 --log-level info

  codeql:
    name: CodeQL
    runs-on: ubuntu-latest
    # This repository is private and GitHub offers no code scanning for it (no GitHub Code Security), so uploading results
    # fails with "Code scanning is not enabled". The analysis still runs on every push and pull request; its report is kept
    # as a downloadable artifact instead of being uploaded. To use GitHub's Security tab later, enable code scanning in
    # the repository settings and delete `upload: never` and the artifact step.
    permissions:
      contents: read
      security-events: read
      # CodeQL reads its own workflow run for status reporting; without this it ends in a configuration error.
      actions: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      # github/codeql-action v3.39.1, pinned by commit SHA.
      - uses: github/codeql-action/init@4bfa242aa49c5f7c6770b98670d354a7dfac05f8
        with:
          languages: javascript-typescript
      - uses: github/codeql-action/analyze@4bfa242aa49c5f7c6770b98670d354a7dfac05f8
        with:
          upload: never
          output: codeql-sarif
      - name: Keep the CodeQL report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: codeql-sarif
          path: codeql-sarif/
          if-no-files-found: error
          retention-days: 14
