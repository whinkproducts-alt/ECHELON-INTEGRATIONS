name: ci

# Pull requests and pushes to main only. A push trigger on claude/** branches made every PR commit run twice (the two
# runs have different refs, so they never cancelled each other). A branch without a PR is tested when its PR is opened.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: typecheck, lint, migrate, test, build, e2e
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: read # the scope step lists the files of a pull request
    services:
      postgres:
        # pgvector/pgvector is PostgreSQL-licensed (permissive) and used in CI only. Same image as docker-compose.yml.
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: whink
          POSTGRES_PASSWORD: ci_only_password
          POSTGRES_DB: whink_ci_test
        ports:
          - 127.0.0.1:5432:5432
        options: >-
          --health-cmd "pg_isready -U whink -d whink_ci_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      # Throwaway values for the CI database and a dummy auth secret. None of these is a real credential.
      DATABASE_URL: postgresql://whink:ci_only_password@127.0.0.1:5432/whink_ci_test
      DIRECT_URL: postgresql://whink:ci_only_password@127.0.0.1:5432/whink_ci_test
      AUTH_SECRET: ci-dummy-auth-secret-not-a-real-secret-0123456789
      NEXTAUTH_SECRET: ci-dummy-auth-secret-not-a-real-secret-0123456789
      AUTH_URL: http://127.0.0.1:3100
      NEXTAUTH_URL: http://127.0.0.1:3100
      WHINK_OWNER_EMAILS: e2e-owner@example.test
      NEXT_TELEMETRY_DISABLED: '1'
      CI: 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Docs-only pull requests skip the heavy steps below but still finish this job green, so a required check is
      # always satisfied. Only files under docs/ and root-level *.md count as docs (nothing in the app or its tests
      # reads them). Both the new and the previous path of every file are checked, so a rename out of code is code.
      # Anything else, a push to main, a list of 3000 files or more (the API's cap, so the list may be incomplete), an
      # empty list, or any error runs everything (fail closed).
      - name: Decide whether the code changed
        id: scope
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          set -uo pipefail
          heavy=true
          if [ "$EVENT" = "pull_request" ]; then
            if records=$(gh api --paginate "repos/$REPO/pulls/$PR_NUMBER/files" --jq '.[] | [.filename, (.previous_filename // "")] | @tsv') && [ -n "$records" ]; then
              total=$(printf '%s\n' "$records" | wc -l)
              paths=$(printf '%s\n' "$records" | tr '\t' '\n' | sed '/^$/d')
              if [ "$total" -lt 3000 ]; then
                # No pipe and no -q: grep reads every path, so nothing can be cut off early. Exit 1 = every path is docs,
                # 0 = at least one other path, anything else = error.
                grep -vE '^(docs/|[^/]+\.md$)' <<<"$paths" >/dev/null; rc=$?
                if [ "$rc" -eq 1 ]; then heavy=false; fi
              fi
            fi
          fi
          echo "heavy=$heavy" >> "$GITHUB_OUTPUT"
          echo "Heavy checks: $heavy"

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        if: ${{ steps.scope.outputs.heavy == 'true' }}
        with:
          version: 10.28.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: ${{ steps.scope.outputs.heavy == 'true' }}
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        if: ${{ steps.scope.outputs.heavy == 'true' }}
        run: pnpm install --frozen-lockfile

      - name: Prisma client
        if: ${{ steps.scope.outputs.heavy == 'true' }}
        run: pnpm --filter app exec prisma generate

      - name: Typecheck
        if: ${{ steps.scope.outputs.heavy == 'true' }}
        run: pnpm --filter app typecheck || pnpm --filter app exec tsc --noEmit

      - name: Lint
        if: ${{ steps.scope.outputs.heavy == 'true' }}
        run: pnpm --filter app lint

      - name: Apply every migration to a real PostgreSQL with pgvector
        if: ${{ steps.scope.outputs.heavy == 'true' }}
        run: pnpm --filter app exec prisma migrate deploy

      - name: Seed
        if: ${{ steps.scope.outputs.heavy == 'true' }}
        run: pnpm --filter app exec prisma db seed

      - name: Unit tests
        if: ${{ steps.scope.outputs.heavy == 'true' }}
        run: M1_EXECUTION_DATABASE_URL="$DATABASE_URL" pnpm --filter app test

      - name: Validate Mac sandbox launch package
        if: ${{ steps.scope.outputs.heavy == 'true' }}
        run: python3 packaging/macos/test_always_on.py

      - name: Build Mac sandbox download
        if: ${{ steps.scope.outputs.heavy == 'true' }}
        run: python3 packaging/macos/build.py --sandbox --output dist/sandbox --format zip

      - name: Upload Mac sandbox download
        if: ${{ !cancelled() && steps.scope.outputs.heavy == 'true' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: echelon-integrations-sandbox-mac
          path: |
            dist/sandbox/ECHELON-Integrations-Sandbox-0.1.2.zip
            dist/sandbox/READ-ME-FIRST.md
            dist/sandbox/release.json
          retention-days: 14
          if-no-files-found: error

      - name: Build
        if: ${{ steps.scope.outputs.heavy == 'true' }}
        run: pnpm --filter app build

      - name: Install e2e dependencies and the Chromium browser
        if: ${{ steps.scope.outputs.heavy == 'true' }}
        working-directory: e2e
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: E2E (real browser, built app, real database)
        if: ${{ steps.scope.outputs.heavy == 'true' }}
        working-directory: e2e
        env:
          # Exercise the sandbox's runtime cookie namespace against real auth.
          WHINK_AUTH_COOKIE_NAMESPACE: echelon-integrations-sandbox
        run: npx playwright test

      - name: Upload e2e report, traces and failure screenshots
        if: ${{ !cancelled() && steps.scope.outputs.heavy == 'true' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: e2e-report
          path: |
            e2e/playwright-report/
            e2e/test-results/
          retention-days: 7
          if-no-files-found: ignore
