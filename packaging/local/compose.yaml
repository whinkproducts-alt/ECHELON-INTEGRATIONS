name: whink-personal
x-runtime: &runtime
  image: whink-personal:${WHINK_RELEASE_ID:?release id required}
  env_file: ${WHINK_RUNTIME_ENV:?private runtime env required}
  restart: unless-stopped
  init: true
  security_opt: ["no-new-privileges:true"]
  cap_drop: [ALL]
services:
  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: whink
      POSTGRES_DB: whink
      POSTGRES_PASSWORD: ${WHINK_DB_PASSWORD:?private password required}
    volumes: ["personal_data:/var/lib/postgresql/data"]
    # Database is never published to a host/network port.
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U whink -d whink"]
      interval: 5s
      timeout: 5s
      retries: 30
  migrate:
    <<: *runtime
    restart: "no"
    build:
      context: ../..
      dockerfile: packaging/local/Dockerfile
    command: [pnpm, --filter, app, exec, prisma, migrate, deploy]
    depends_on:
      postgres: {condition: service_healthy}
  web:
    <<: *runtime
    ports: ["127.0.0.1:${WHINK_HTTP_PORT:-3211}:3000"]
    depends_on:
      migrate: {condition: service_completed_successfully}
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:3000/login').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s
  worker:
    <<: *runtime
    # Daily speech probes must reach the same loopback adapters as web requests.
    network_mode: service:web
    command: [pnpm, --filter, app, worker]
    depends_on:
      web: {condition: service_healthy}
  local-speech:
    profiles: [speech]
    build:
      context: ../../services/local-speech
      dockerfile: Dockerfile.runtime
    image: whink-local-speech:${WHINK_RELEASE_ID:?release id required}
    network_mode: service:web
    restart: unless-stopped
    init: true
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    environment:
      LOCAL_SPEECH_TOKEN: ${LOCAL_SPEECH_TOKEN:-}
      WHISPER_MODEL_PATH: /models/whisper-small.en
      HF_HOME: /models/hf
    volumes: ["speech_models:/models:ro"]
    depends_on:
      web: {condition: service_healthy}
  voicestudio-bridge:
    profiles: [voicestudio]
    build:
      context: ../../services/voicestudio-bridge
    network_mode: service:web
    restart: unless-stopped
    init: true
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    environment:
      VOICESTUDIO_API_KEY: ${VOICESTUDIO_API_KEY:-}
      VOICESTUDIO_HOST_PORT: ${VOICESTUDIO_HOST_PORT:-3900}
    extra_hosts: ["host.docker.internal:host-gateway"]
    depends_on:
      web: {condition: service_healthy}
volumes:
  personal_data:
    # A separate persistent database; never points at the existing developer DB.
    name: whink-personal-data
  speech_models:
    name: whink-personal-speech-models
