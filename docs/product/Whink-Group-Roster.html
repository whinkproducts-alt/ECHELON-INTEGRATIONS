function card(p,tagClass){
  const d=document.createElement('div');
  d.className='card';
  d.dataset.search=(p.name+' '+(p.role||'')).toLowerCase();
  d.innerHTML=`<div class="name">${p.name}</div><div class="role">${p.role}</div><span class="tag t-${tagClass}">${tagClass.toUpperCase()}</span>`;
  return d;
}

function populate(id,arr,tagClass){
  const c=document.getElementById(id);
  arr.forEach(p=>c.appendChild(card(p,tagClass)));
}
populate('board',BOARD,'board');
populate('ai',AI,'ai');
populate('subs',SUBS,'sub');
populate('kill',KILL,'kill');

const dirsEl=document.getElementById('dirs');
DIRS.forEach(d=>{
  const blk=document.createElement('div');
  blk.className='dir-block';
  blk.dataset.search=(d.title+' '+d.director).toLowerCase();

  const hd=document.createElement('div');
  hd.className='dir-hd';
  hd.innerHTML=`<span>${d.title} <span style="color:var(--fg2);font-weight:400">· ${d.director}</span></span><span class="toggle">▶</span>`;
  blk.appendChild(hd);

  const body=document.createElement('div');
  body.className='dir-body';
  d.depts.forEach(dep=>{
    const row=document.createElement('div');
    row.className='dept-row';
    row.dataset.search=(dep.name+' '+dep.head+' '+dep.lead).toLowerCase();
    row.innerHTML=`<div><div class="dept-name">${dep.name}</div><div class="dept-head">Head: ${dep.head}</div><div class="team-lead">Lead: ${dep.lead}</div></div>`;
    body.appendChild(row);
  });
  blk.appendChild(body);

  hd.addEventListener('click',()=>{
    const open=body.classList.toggle('open');
    hd.classList.toggle('open',open);
  });

  dirsEl.appendChild(blk);
});

document.getElementById('expandAll').addEventListener('click',()=>{
  document.querySelectorAll('.dir-body').forEach(el=>el.classList.add('open'));
  document.querySelectorAll('.dir-hd').forEach(el=>el.classList.add('open'));
});
document.getElementById('collapseAll').addEventListener('click',()=>{
  document.querySelectorAll('.dir-body').forEach(el=>el.classList.remove('open'));
  document.querySelectorAll('.dir-hd').forEach(el=>el.classList.remove('open'));
});

let dark=true;
document.getElementById('themeToggle').addEventListener('click',()=>{
  dark=!dark;
  document.documentElement.dataset.theme=dark?'dark':'light';
  document.getElementById('themeToggle').textContent=dark?'☀︎':'☾';
});

const search=document.getElementById('search');
search.addEventListener('input',()=>{
  const q=search.value.trim().toLowerCase();
  document.querySelectorAll('.card,[data-search]').forEach(el=>{
    if(!q){el.classList.remove('hidden','match');return;}
    const hit=(el.dataset.search||'').includes(q);
    el.classList.toggle('hidden',!hit);
    el.classList.toggle('match',hit);
    if(hit&&el.classList.contains('dept-row')){
      el.closest('.dir-body')?.classList.add('open');
      el.closest('.dir-body')?.previousElementSibling?.classList.add('open');
    }
  });
  document.querySelectorAll('.dir-block').forEach(blk=>{
    if(!q){blk.classList.remove('hidden');return;}
    const anyVisible=[...blk.querySelectorAll('[data-search]')].some(el=>!el.classList.contains('hidden'));
    const selfHit=(blk.dataset.search||'').includes(q);
    blk.classList.toggle('hidden',!anyVisible&&!selfHit);
  });
});
</script>
