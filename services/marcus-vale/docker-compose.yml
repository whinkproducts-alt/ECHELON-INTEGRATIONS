
# Secrets come from .env (see .env.example). Compose refuses to start if one is missing.
services:
  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_DB: marcus
      POSTGRES_USER: whink
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    ports:
      - "127.0.0.1:5433:5432"  # Avoid conflict with whink-ultimate-postgres-1
    volumes:
      - marcus_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U whink"]
      interval: 5s
      timeout: 5s
      retries: 10

  whisper:
    image: fedirz/faster-whisper-server:latest-cpu
    restart: unless-stopped
    ports:
      - "127.0.0.1:8767:8000"
    environment:
      WHISPER__MODEL: base
    volumes:
      - marcus_whisper_cache:/root/.cache/huggingface

  kokoro:
    image: ghcr.io/remsky/kokoro-fastapi-cpu:v0.2.2
    restart: unless-stopped
    ports:
      - "127.0.0.1:8768:8880"

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "127.0.0.1:8002:8000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      DATABASE_URL: postgresql+asyncpg://whink:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@postgres:5432/marcus
      API_KEY: ${API_KEY:?set API_KEY in .env}
      OMNIROUTE_API_KEY: ${OMNIROUTE_API_KEY:?set OMNIROUTE_API_KEY in .env}
      ECHELON_API_KEY: ${ECHELON_API_KEY:-}
      OMNIROUTE_BASE_URL: http://host.docker.internal:20128/v1
      OMNIROUTE_MODEL: ${OMNIROUTE_MODEL:-gpt-4o-mini}
      ECHELON_BASE_URL: ${ECHELON_BASE_URL:-http://host.docker.internal:3000}
      WHISPER_URL: http://whisper:8000
      KOKORO_URL: http://kokoro:8880
      MARCUS_ENV: local
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "127.0.0.1:7000:80"
    environment:
      MARCUS_API_KEY: ${API_KEY:?set API_KEY in .env}
    depends_on:
      - backend

volumes:
  marcus_pgdata:
  marcus_whisper_cache:
