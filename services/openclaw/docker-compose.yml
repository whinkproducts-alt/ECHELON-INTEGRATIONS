# WHINK MCP gateway. Add or swap MCP servers by editing this file and
# config/servers.json only. See README.md.
#
# Required: OPENCLAW_TOKEN, read automatically from services/openclaw/.env (git-ignored).
#   openssl rand -hex 32   -> same value in services/openclaw/.env and apps/web/.env
# The port is published on 127.0.0.1 only. Never expose it to the internet.

services:
  openclaw:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        EXTRA_APK: ""   # OS packages for baked stdio servers only. Third-party servers belong in their own service.
        # Local dev: "true" bundles the reference server so `ref` tools work. Product images: "false".
        INCLUDE_REF_SERVER: "true"
    restart: unless-stopped
    # Hardening: unprivileged user, read-only root, no capabilities, no privilege escalation.
    user: "1000:1000"
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      # Only place the container can write. Gone on restart. npx/uvx caches land under /home/node.
      - /tmp:size=64m,mode=1777,uid=1000,gid=1000
      - /home/node:size=256m,mode=0755,uid=1000,gid=1000
    pids_limit: 256
    # Budget for a 16 GB Mac: idle gateway plus the reference server is ~100 MB.
    mem_limit: 512m
    cpus: 1.0
    ports:
      - "127.0.0.1:3100:3100"
    volumes:
      - ./config:/app/config:ro
    environment:
      PORT: "3100"
      HOST: "0.0.0.0"   # inside the container only; the publish rule above limits the host side
      CONFIG_PATH: /app/config/servers.json
      # If config/local/servers.json exists (untracked) it replaces config/servers.json.
      # Host header allow-list (DNS-rebinding defence). Add names only if clients reach the gateway by them.
      GATEWAY_ALLOWED_HOSTS: ${GATEWAY_ALLOWED_HOSTS:-localhost,127.0.0.1,[::1],openclaw}
      OPENCLAW_TOKEN: ${OPENCLAW_TOKEN:?set OPENCLAW_TOKEN in services/openclaw/.env (openssl rand -hex 32)}
      # Upstream credentials: list the variable NAME here and in config/servers.json.
      # Names must start with the platform prefix, e.g. GITHUB_ for platform "github".
      # GITHUB_PERSONAL_ACCESS_TOKEN: ${GITHUB_PERSONAL_ACCESS_TOKEN:-}

    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3100/healthz"]
      interval: 15s
      timeout: 3s
      retries: 3
      start_period: 10s

  # Third-party MCP servers run as SEPARATE services and are reached over http (see README).
  # They share neither a uid nor a /proc with the gateway, so they cannot read OPENCLAW_TOKEN.
  # github-mcp:
  #   image: ghcr.io/github/github-mcp-server   # MIT. Pin a version tag or digest.
  #   command: ["http"]                          # streamable HTTP, default port 8082
  #   restart: unless-stopped
  #   read_only: true
  #   user: "1000:1000"
  #   cap_drop: [ALL]
  #   security_opt: ["no-new-privileges:true"]
  #   mem_limit: 256m
  #   expose: ["8082"]                           # internal network only, never `ports:`
  #   # No token here: the gateway forwards GITHUB_PERSONAL_ACCESS_TOKEN as an Authorization header.
